name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build, sign, notarize, release
    runs-on: macos-14
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION (tag=$TAG)"

      - name: Show toolchain
        run: swift --version

      - name: Build universal release binary
        run: |
          swift build -c release \
            --arch arm64 \
            --arch x86_64
          mkdir -p dist
          cp .build/apple/Products/Release/crunch dist/crunch
          file dist/crunch
          lipo -info dist/crunch

      - name: Import Developer ID signing certificate
        if: env.DEVELOPER_ID_CERT_P12 != ''
        env:
          DEVELOPER_ID_CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$DEVELOPER_ID_CERT_P12" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -P "$DEVELOPER_ID_CERT_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | tr -d '"')
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Codesign binary
        if: env.DEVELOPER_ID_IDENTITY != ''
        env:
          DEVELOPER_ID_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
        run: |
          codesign --force --options runtime --timestamp \
            --sign "$DEVELOPER_ID_IDENTITY" \
            dist/crunch
          codesign --verify --strict --verbose=2 dist/crunch

      - name: Package tarball
        id: pack
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          NAME="crunch-${VERSION}-macos-universal"
          mkdir -p "dist/$NAME"
          cp dist/crunch "dist/$NAME/crunch"
          cp LICENSE "dist/$NAME/LICENSE"
          cp README.md "dist/$NAME/README.md"
          ( cd dist && tar -czf "${NAME}.tar.gz" "$NAME" )
          ( cd dist && shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256" )
          echo "tarball=dist/${NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/${NAME}.tar.gz.sha256" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Notarize tarball
        if: env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          xcrun notarytool submit "$TARBALL" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

      - name: Extract release notes for tag
        id: notes
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" { capture=1; next }
              capture && /^## \[/ { exit }
              capture { print }
            ' CHANGELOG.md > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            echo "Release $VERSION" > release-notes.md
          fi
          echo "path=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "${{ steps.notes.outputs.path }}" \
            "${{ steps.pack.outputs.tarball }}" \
            "${{ steps.pack.outputs.checksum }}"

      - name: Bump Homebrew tap formula
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          NAME: ${{ steps.pack.outputs.name }}
        run: |
          set -euo pipefail
          SHA256=$(awk '{print $1}' "${{ steps.pack.outputs.checksum }}")
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${NAME}.tar.gz"
          WORK="$RUNNER_TEMP/tap"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/dinhnhat0401/homebrew-crunch.git" "$WORK"
          mkdir -p "$WORK/Formula"
          cat > "$WORK/Formula/crunch.rb" <<RUBY
          class Crunch < Formula
            desc "Compress video, image, PDF, and audio files locally on macOS"
            homepage "https://github.com/dinhnhat0401/crunch-cli"
            url "${URL}"
            sha256 "${SHA256}"
            version "${VERSION}"
            license "MIT"

            depends_on :macos => :sonoma

            def install
              bin.install "crunch"
            end

            test do
              assert_match "crunch ${VERSION}", shell_output("#{bin}/crunch --version")
            end
          end
          RUBY
          cd "$WORK"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/crunch.rb
          git commit -m "crunch ${VERSION}"
          git push origin HEAD
